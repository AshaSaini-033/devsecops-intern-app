apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-intern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-intern-app
  template:
    metadata:
      labels:
        app: devsecops-intern-app
    spec:
      containers:
        - name: devsecops-intern-app
          image: devsecops-intern-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
